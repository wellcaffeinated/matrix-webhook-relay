services:
  matrix-webhook-relay:
    image: ghcr.io/wellcaffeinated/matrix-webhook-relay:latest
    container_name: matrix-webhook-relay
    restart: unless-stopped
    environment:
      - HOMESERVER_URL=https://matrix.org
      - WEBHOOK_URL=http://n8n:5678/webhook/matrix-relay
      - WEBHOOK_TIMEOUT_MS=30000
      - ACCESS_TOKEN_FILE=/run/secrets/access_token
      - USER_ID=@your-bot-username:matrix.org
      - DEVICE_NAME=Matrix Webhook Relay Bot
      - ALLOWED_ROOMS=!yourroomid:matrix.org,!anotherroomid:matrix.org
      - LOG_LEVEL=debug
    volumes:
      - matrix-relay-data:/data
    secrets:
      - access_token
    networks:
      - matrix-relay-network

volumes:
  matrix-relay-data:

secrets:
  access_token:
    file: ./secrets/access_token

networks:
  matrix-relay-network:
    external: true
